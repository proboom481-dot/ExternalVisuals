name: Build ExternalVisuals

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - rebuild
      - rebuild-fixed
      - rebuild-1.4.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.4.2'

      - name: Build
        run: gradle build --no-daemon

      - name: Upload ExternalVisuals
        uses: actions/upload-artifact@v4
        with:
          name: ExternalVisuals
          path: build/libs/*.jar